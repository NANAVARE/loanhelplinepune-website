name: Auto-publish blog post

# Real automation: runs weekly, calls Claude to write a new SEO article,
# and pushes it to the site. Safe to run unattended because the content
# rules (in automation/generate_blog_post.py) forbid any rate/approval
# claims — only educational articles are ever produced.

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC (~8:30 AM IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install anthropic

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/generate_blog_post.py

      - name: Commit and push new post
        run: |
          git config user.name "loanhelplinepune-bot"
          git config user.email "bot@loanhelplinepune.in"
          git add blog/ automation/topic_state.json
          git diff --quiet --cached || git commit -m "Auto: publish new blog post [skip ci]"
          git push
