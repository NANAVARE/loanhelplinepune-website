<!DOCTYPE html>
<html lang="mr">
<head>

    <title>Loan Help Line Pune</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- हेडर / नॅव्हिगेशन सेक्शन -->
    <header>
        <div class="logo">LoanHelpline Pune</div>
        <nav>
            <a href="index.html" id="nav-home">मुख्यपृष्ठ</a>
            <a href="about.html" id="nav-services">सेवा</a>
            <a href="contact.html" id="nav-enquiry">चौकशी</a>
        </nav>
        
        <!-- भाषा बदलण्यासाठी बटने (Language Toggle Buttons) -->
        <div class="lang-switcher">
            <button onclick="changeLanguage('en')">English</button>
            <button onclick="changeLanguage('mr')">मराठी</button>
        </div>

    <!-- मुख्य हिरो सेक्शन -->

        <div class="cta-buttons">
            <a href="https://wa.me/919822000000" target="_blank" class="whatsapp-btn">
                <span id="whatsapp-chat-text">WhatsApp वर चॅट करा</span>
            </a>
        </div>
    </section>

    <!-- फ्लोटिंग WhatsApp बटण -->
    <div class="floating-whatsapp">
        <a href="https://wa.me/919822000000" target="_blank">
            <span id="whatsapp-contact-text">WhatsApp वर संपर्क करा</span>
        </a>
    </div>

    <!-- जावास्क्रिप्ट फाईल लिंक -->
    <script src="script.js"></script>
</body>
</html>
